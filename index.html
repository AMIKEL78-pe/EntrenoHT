<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan de Entrenamiento Hattrick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: banda de pizarra táctica con los controles; debajo, tablas de plantilla como herramienta de trabajo. */
:root{
  --bg:#f3f6f1;--surface:#ffffff;--surface2:#e8eee5;--fg:#16251b;--muted:#566559;--line:#ccd7ca;
  --pitch:#17452c;--pitch-fg:#f1f7ef;--pitch-muted:#b6cdb9;--pitch-line:#39694b;--accent:#176a3a;
  --full:#3f8f58;--full-fg:#ffffff;--part:#a9cfac;--part-fg:#17361f;--osm:#c9cfc8;--osm-fg:#2c352e;--none:#eef1ec;--none-fg:#68746b;
  --gold:#a86a00;--gold-bg:#fbefd5;--warn:#a93226;--warn-bg:#fbe6e2;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:Bahnschrift,"DIN Alternate","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --data:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a14;--surface:#17231b;--surface2:#203026;--fg:#e8f0e8;--muted:#a0b0a3;--line:#33453a;
  --pitch:#0f3321;--pitch-fg:#eff7ef;--pitch-muted:#a8c4ad;--pitch-line:#2f5a40;--accent:#7bd197;
  --full:#3b9258;--full-fg:#ffffff;--part:#3c6a4a;--part-fg:#e4f5e6;--osm:#46524a;--osm-fg:#e4ebe4;--none:#1d2a22;--none-fg:#94a497;
  --gold:#f0bd5e;--gold-bg:#3a2d12;--warn:#f39a8d;--warn-bg:#40201b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a14;--surface:#17231b;--surface2:#203026;--fg:#e8f0e8;--muted:#a0b0a3;--line:#33453a;
  --pitch:#0f3321;--pitch-fg:#eff7ef;--pitch-muted:#a8c4ad;--pitch-line:#2f5a40;--accent:#7bd197;
  --full:#3b9258;--full-fg:#ffffff;--part:#3c6a4a;--part-fg:#e4f5e6;--osm:#46524a;--osm-fg:#e4ebe4;--none:#1d2a22;--none-fg:#94a497;
  --gold:#f0bd5e;--gold-bg:#3a2d12;--warn:#f39a8d;--warn-bg:#40201b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.board{background:var(--pitch);color:var(--pitch-fg);padding-block:18px 0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:baseline}
h1{font:600 26px/1.15 var(--display);margin:0;letter-spacing:.2px;text-wrap:balance}
.head small{color:var(--pitch-muted);font-size:13px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px 14px;margin-top:14px}
.settings label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;letter-spacing:.3px;color:var(--pitch-muted);min-width:0}
.settings select,.settings input{background:var(--pitch);color:var(--pitch-fg);border:1px solid var(--pitch-line);border-radius:4px;padding:6px;font:13px var(--ui);width:100%;min-width:0}
nav.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto}
nav.tabs button{background:transparent;color:var(--pitch-muted);border:0;padding:9px 14px;font:600 14px var(--ui);cursor:pointer;border-radius:5px 5px 0 0;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--fg)}
nav.tabs button:hover{color:var(--pitch-fg)}nav.tabs button[aria-selected="true"]:hover{color:var(--fg)}
main{padding-block:18px 48px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h2{font:600 19px/1.25 var(--display);margin:0 0 4px}
h3{font:600 15px/1.3 var(--ui);margin:18px 0 6px}
p{margin:0 0 8px;max-width:75ch}.note{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:12px}
.controls label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
select,input,textarea{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px;font:13px var(--ui);max-width:100%}
.big{font-size:15px;font-weight:600;min-width:min(280px,100%)}
button.act,label.act{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font:600 13px var(--ui);cursor:pointer}
button.act:hover,label.act:hover{border-color:var(--accent);color:var(--accent)}input[type=file]:focus-visible+*,label.act:focus-within{outline:2px solid var(--accent)}
button.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}button.pri:hover{color:var(--bg);opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px}
.kpi{background:var(--surface);padding:9px 12px;min-width:0}.kpi b{display:block;font:600 21px/1.2 var(--display);font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}
.lineup{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px;font-size:12.5px}
.chip{display:inline-block;padding:1px 7px;border-radius:3px;font:600 12px var(--data);white-space:nowrap}
.c100{background:var(--full);color:var(--full-fg)}.c50{background:var(--part);color:var(--part-fg)}.cos{background:var(--osm);color:var(--osm-fg)}.c0{background:var(--none);color:var(--none-fg)}.cgold{background:var(--gold-bg);color:var(--gold)}.cwarn{background:var(--warn-bg);color:var(--warn)}
.tw{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
td.num,th.num{text-align:right}td select{padding:2px;font-size:12px}
td.name,th.name{position:sticky;left:0;background:var(--surface);z-index:1;max-width:210px;overflow:hidden;text-overflow:ellipsis}th.name{background:var(--surface2);z-index:2}
tr.off td:not(.name){color:var(--muted)}
.lvl{font:12px var(--data)}.lvl em{font-style:normal;color:var(--muted)}
.wk{display:inline-block;min-width:30px;text-align:center;font:600 12.5px var(--data);padding:1px 3px;border-radius:3px}
.fast{background:var(--full);color:var(--full-fg)}.mid{background:var(--part);color:var(--part-fg)}.slow{background:var(--osm);color:var(--osm-fg)}.vslow{background:var(--none);color:var(--none-fg)}
.flag{color:var(--gold);font-size:11px;margin-left:5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:9px 0;font-size:12px;color:var(--muted);align-items:center}
.gantt{display:flex;height:48px;border:1px solid var(--line);margin:12px 0 2px;overflow:hidden}
.gantt div{display:flex;flex-direction:column;justify-content:center;padding:0 7px;color:var(--pitch-fg);overflow:hidden;font-size:12px;border-right:2px solid var(--bg);min-width:0;white-space:nowrap}
.gantt div b{overflow:hidden;text-overflow:ellipsis}
.ticks{position:relative;height:20px;font:11px var(--data);color:var(--muted)}.ticks span{position:absolute;transform:translateX(-50%)}.ticks span:first-child{transform:none}
.blocks{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.block{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:7px 9px;background:var(--surface);border:1px solid var(--line)}
.block select{flex:1 1 210px;min-width:0}.block input{width:66px}.block .dates{font:12px var(--data);color:var(--muted);flex:1 1 170px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.scroll{max-height:440px;overflow:auto}
textarea{width:100%;min-height:115px;font:12px var(--data)}
code{font:12.5px var(--data);background:var(--surface2);padding:1px 4px;border-radius:3px}
.formula{font:13px/1.7 var(--data);background:var(--surface);border:1px solid var(--line);padding:10px;overflow-x:auto;white-space:pre-wrap;max-width:100%}
.folder{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px;font-size:13px;color:var(--pitch-muted);min-height:30px}
.folder b{color:var(--pitch-fg)}.folder button{background:transparent;color:var(--pitch-fg);border:1px solid var(--pitch-muted);border-radius:4px;padding:4px 10px;font:600 13px var(--ui);cursor:pointer}.folder button:hover{background:var(--pitch-line)}
.empty{background:var(--surface);border:1px solid var(--line);padding:22px;max-width:640px}
.pitch{background:var(--pitch);border-radius:6px;padding:12px 8px;display:flex;flex-direction:column;gap:10px;min-width:0}
.prow{display:flex;justify-content:center;gap:6px;flex-wrap:nowrap}@media(max-width:620px){.prow{flex-wrap:wrap}.slot{flex-basis:calc(50% - 3px)!important}}
.slot{background:var(--surface);color:var(--fg);flex:0 1 150px;padding:6px 7px;border-radius:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.slot .pl{display:flex;justify-content:space-between;font:600 11px var(--data);color:var(--muted)}.slot select{width:100%;font-size:12px;padding:3px}
.luwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}@media(max-width:900px){.luwrap{grid-template-columns:minmax(0,1fr)}}
.rats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.rat{background:var(--surface);border:1px solid var(--line);padding:7px 8px;min-width:0}
.rat span{display:block;font-size:11px;color:var(--muted)}.rat b{display:block;font:600 18px/1.2 var(--display);font-variant-numeric:tabular-nums}.rat i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rat.mid{grid-column:1/-1}.rat .bar{height:5px;background:var(--surface2);margin-top:5px}.rat .bar div{height:100%;background:var(--full)}.rat.weak{border-color:var(--gold)}
.recs{display:flex;flex-direction:column;gap:8px}.rec{background:var(--surface);border:1px solid var(--line);padding:9px 11px}.rec b{font-size:14px}.rec .note{margin:3px 0 0}
.best{background:var(--full);color:var(--full-fg);border-radius:3px;padding:0 4px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:18px;margin-top:14px}.three>div{min-width:0}
a{color:var(--accent)}
ul{padding-left:20px;margin:6px 0;max-width:75ch}li{margin-bottom:4px}
.msg{min-height:18px;font-size:13px;color:var(--accent);margin:6px 0}
@media (prefers-reduced-motion:no-preference){button{transition:color .1s,border-color .1s}}
</style>

<header class="board"><div class="wrap">
  <div class="head"><h1 id="ttl">Plan de Entrenamiento</h1><small id="sub"></small></div>
  <div class="folder" id="folder" role="status"></div>
  <div class="settings" id="settings"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div></header>
<main class="wrap" id="main"></main>

<script>
/* ===== Datos ===== */
var SK=[['gk','Portería'],['def','Defensa'],['pm','Jugadas'],['wg','Lateral'],['pa','Pases'],['sc','Anotación'],['sp','Balón parado']];
var SKN={};SK.forEach(function(s){SKN[s[0]]=s[1]});
var LV=['inexistente','desastroso','horrible','pobre','débil','insuficiente','aceptable','bueno','excelente','formidable','destacado','brillante','magnífico','clase mundial','sobrenatural','titánico','extraterrestre','mítico','mágico','utópico','divino'];
var POS=['POR','DL','DC','LAT','MC','DEL'];
var ALL=POS.slice(), OUT=['DL','DC','LAT','MC','DEL'];
/* k, posiciones y ósmosis: constantes públicas de Hattrick Organizer (core/training/type). */
var TY=[
 {id:'gk',n:'Portería',sk:'gk',k:5.1,full:['POR'],part:[],os:0,f:{POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0}},
 {id:'def',n:'Defensa',sk:'def',k:2.88,full:['DL','DC'],part:[],os:1/6,f:{POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0}},
 {id:'pm',n:'Jugadas',sk:'pm',k:3.36,full:['MC'],part:['LAT'],os:1/8,f:{POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0}},
 {id:'wg',n:'Lateral',sk:'wg',k:4.8,full:['LAT'],part:['DL'],os:1/8,f:{POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0}},
 {id:'pa',n:'Pases',sk:'pa',k:3.6,full:['LAT','MC','DEL'],part:[],os:1/6,f:{POR:1,DL:2,DC:2,LAT:2,MC:2,DEL:2}},
 {id:'sc',n:'Anotación',sk:'sc',k:3.24,full:['DEL'],part:[],os:1/6,f:{POR:1,DL:2,DC:2,LAT:2,MC:1,DEL:3}},
 {id:'sp',n:'Balón parado',sk:'sp',k:14.7,full:ALL,part:[],os:0,bonus:1,f:{POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0}},
 {id:'dp',n:'Defensa (porteros, defensores y mediocampo)',sk:'def',k:1.38,full:['POR','DL','DC','LAT','MC'],part:[],os:1/6,f:{POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0}},
 {id:'wa',n:'Lateral (laterales y delanteros)',sk:'wg',k:3.12,full:['LAT','DEL'],part:[],os:5/39,f:{POR:1,DL:2,DC:2,LAT:2,MC:1,DEL:3}},
 {id:'tp',n:'Pases (defensores y mediocampo)',sk:'pa',k:3.15,full:['DL','DC','LAT','MC'],part:[],os:1/6,f:{POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0}},
 {id:'sh',n:'Anotación y balón parado',sk:'sc',k:1.5,full:ALL,part:[],os:0,f:{POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0}}
];
var TYM={};TY.forEach(function(t){TYM[t.id]=t});
var COACH=[[.7343,'73%'],[.8324,'83%'],[.92,'92%'],[1,'100%'],[1.0375,'104%']];
function nextThu(){var d=new Date();while(d.getDay()!==4)d.setDate(d.getDate()+1);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function defaults(){return {club:'',set:{coach:1,ass:10,int:100,stam:10,start:nextThu(),prog:0,cal:100},players:[],base:{},lineups:{},taker:'',type:'pm',levels:3,filter:'all',sort:'weeks',cmpMode:'plan',tab:'team',
 blocks:[{t:'pm',w:8}],evp:''}}
var KEY='ht-plan-entrenamiento-v2',S=defaults();
try{var sv=localStorage.getItem(KEY);if(sv){var pj=JSON.parse(sv);S=Object.assign(defaults(),pj)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}scheduleFolderSave()}

/* ===== Motor ===== */
function factorSkill(l){var f=l<9?16.289*Math.exp(-.1396*l):54.676/l-1.438;return Math.max(f,.05)}
function ageOf(p,wk){return p.y+(p.d+7*(wk||0))/112}
function gain(level,age,ty,time,s){s=s||S.set;return Math.min(1,ty.k*time*(54/(age+37))*(1+.035*s.ass)*s.coach*(1-s.stam/100)*(s.int/100)*factorSkill(level)*.01*(s.cal/100))}
function lineup(tid){if(!S.lineups[tid])S.lineups[tid]=JSON.parse(JSON.stringify(S.base));return S.lineups[tid]}
function posValue(ty,pos){if(!pos)return 0;if(ty.bonus&&pos==='POR')return 1.25;if(ty.full.indexOf(pos)>=0)return 1;if(ty.part.indexOf(pos)>=0)return .5;return ty.os}
function timeFor(p,ty,ideal){if(ideal)return 1;var l=lineup(ty.id)[p.name]||['',''];var v=Math.max(posValue(ty,l[0]),posValue(ty,l[1]));if(ty.bonus&&S.taker===p.name&&(l[0]||l[1]))v=1.25;return v}
function stepWeeks(p,ty,n,time){var r=[],lvl=p.s[ty.sk],pr=S.set.prog/100,w=0;if(!time)return r;
 for(var i=0;i<n;i++){var c=0;while(pr<1&&w<780){pr+=gain(lvl,ageOf(p,w),ty,time);w++;c++}if(pr<1)break;pr-=1;lvl++;r.push({w:c,total:w,lvl:lvl})}return r}
function addWeeks(iso,w){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+7*w);return d}
function fmt(d){return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()}
function dateAt(total){return fmt(addWeeks(S.set.start,total-1))}
function fmtAge(a){var y=Math.floor(a);return y+'a '+Math.round((a-y)*112)+'d'}
function pct(t){return t>=1.25?'125%':t===1?'100%':t===.5?'50%':t?dec(Math.round(t*1000)/10)+'%':'0%'}
function chipCls(t){return t>=1?'c100':t===.5?'c50':t?'cos':'c0'}
function wkCls(w){return w<=6?'fast':w<=10?'mid':w<=16?'slow':'vslow'}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lvName(l){return LV[l]||('nivel '+l)}
/* Simula la cadena de bloques */
function simulate(){var res={},ev=[],wk=0;S.players.forEach(function(p){res[p.name]={s:Object.assign({},p.s),pr:{gk:0,def:0,pm:0,wg:0,pa:0,sc:0,sp:0}};SK.forEach(function(k){res[p.name].pr[k[0]]=S.set.prog/100})});
 S.blocks.forEach(function(b){var ty=TYM[b.t];for(var i=0;i<b.w;i++){S.players.forEach(function(p){var t=timeFor(p,ty);if(!t)return;var r=res[p.name];r.pr[ty.sk]+=gain(r.s[ty.sk],ageOf(p,wk),ty,t);if(r.pr[ty.sk]>=1){r.pr[ty.sk]-=1;r.s[ty.sk]++;ev.push({wk:wk+1,name:p.name,sk:ty.sk,lvl:r.s[ty.sk],ty:ty.n})}});wk++}});
 return{res:res,ev:ev,weeks:wk}}

/* ===== Interfaz ===== */
function opt(v,l,sel){return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>'}
function renderSettings(){var s=S.set,h='';
 h+='<label for="sCoach">Velocidad del entrenador<select id="sCoach" data-set="coach">'+COACH.map(function(c){return opt(c[0],c[1],s.coach)}).join('')+'</select></label>';
 h+='<label for="sAss">Niveles de asistentes (+'+Math.round(s.ass*3.5*10)/10+'%)<input id="sAss" data-set="ass" type="number" min="0" max="10" value="'+s.ass+'"></label>';
 h+='<label for="sInt">Intensidad %<input id="sInt" data-set="int" type="number" min="1" max="100" value="'+s.int+'"></label>';
 h+='<label for="sSta">Condición %<input id="sSta" data-set="stam" type="number" min="0" max="90" value="'+s.stam+'"></label>';
 h+='<label for="sSt">Próximo entrenamiento<input id="sSt" data-set="start" type="date" value="'+s.start+'"></label>';
 h+='<label for="sPr">Avance ya acumulado<select id="sPr" data-set="prog">'+[[0,'0% (recién subido)'],[25,'25%'],[50,'50%'],[75,'75%']].map(function(o){return opt(o[0],o[1],s.prog)}).join('')+'</select></label>';
 document.getElementById('settings').innerHTML=h;
 document.getElementById('ttl').textContent='Plan de Entrenamiento'+(S.club?' · '+S.club:'');
 document.getElementById('sub').textContent='Eficiencia de la habilidad '+Math.round((1-s.stam/100)*s.coach*100)+'% · '+S.players.length+' jugadores';
}
var TABS=[['sim','Simulador'],['cmp','Comparar'],['plan','Cronograma'],['lu','Alineaciones'],['team','Plantilla'],['met','Método']];
var EX=[['f','Forma',6,1,8],['st','Condición',7,1,9],['xp','Experiencia',3,0,20],['loy','Lealtad',10,0,20]];
function ax(p,k){var e=EX.filter(function(x){return x[0]===k})[0];return p[k]===undefined||p[k]===''||isNaN(p[k])?e[2]:+p[k]}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join('')}
function typeOpts(sel){return TY.map(function(t){return opt(t.id,t.n,sel)}).join('')}

function lineupSummary(ty){var l=lineup(ty.id),c=[{},{}];POS.forEach(function(p){c[0][p]=0;c[1][p]=0});var tot=[0,0],fullC=[0,0];
 S.players.forEach(function(p){var v=l[p.name]||['',''];[0,1].forEach(function(i){if(v[i]){c[i][v[i]]++;tot[i]++;if(ty.full.indexOf(v[i])>=0)fullC[i]++}})});

function autoLeague(){var f={POR:1,DL:2,DC:3,LAT:2,MC:3,DEL:0};S.players.slice().sort(function(a,b){return b.tsi-a.tsi}).forEach(function(p){if(p.role&&f[p.role]>0){S.base[p.name][0]=p.role;f[p.role]--}})}
function parseCSV(text){text=text.replace(/^﻿/,'');var first=text.split(/\r?\n/)[0],best=';',n=-1;[';',',','\t'].forEach(function(s){var c=first.split(s).length;if(c>n){n=c;best=s}});
 var rows=[],row=[],cur='',q=false;for(var i=0;i<text.length;i++){var c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===best){row.push(cur);cur=''}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(c!=='\r')cur+=c}
 if(cur||row.length){row.push(cur);rows.push(row)}return rows}
function norm(x){return String(x).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function csvPlayers(text){var rows=parseCSV(text).filter(function(r){return r.join('').trim()}),errs=[];if(rows.length<2)return{errs:['El archivo no tiene filas de jugadores.']};
 var col={};rows[0].forEach(function(h,i){col[norm(h)]=i});var alias={jugador:'nombre',anos:'anos',edad:'anos'};Object.keys(alias).forEach(function(a){if(col[a]!==undefined&&col[alias[a]]===undefined)col[alias[a]]=col[a]});
 var skc=SK.map(function(k){return[k[0],k[1],norm(k[1])]});var req=[['nombre','Nombre'],['anos','Años'],['dias','Días']].concat(skc.map(function(k){return[k[2],k[1]]}));

 function val(r,k){return col[k]===undefined?'':String(r[col[k]]===undefined?'':r[col[k]]).trim()}
 rows.slice(1).forEach(function(r,i){var line=i+2,name=val(r,'nombre');if(!name){errs.push('Fila '+line+': falta el nombre.');return}if(seen[norm(name)]){errs.push('Fila '+line+': '+name+' está repetido.');return}seen[norm(name)]=1;
  var o={name:name,y:+val(r,'anos'),d:+val(r,'dias'),tsi:+val(r,'tsi').replace(/\D/g,'')||0,spec:val(r,'especialidad')||'-',role:val(r,'rol').toUpperCase(),s:{},a:val(r,'liga').toUpperCase(),b:val(r,'amistoso').toUpperCase()};[['f','forma'],['st','condicion'],['xp','experiencia'],['loy','lealtad']].forEach(function(k){var t=val(r,k[1]);if(t!==''&&!isNaN(+t))o[k[0]]=+t});
  if(!val(r,'anos')||!(o.y>=15&&o.y<=70))errs.push('Fila '+line+': Años debe estar entre 15 y 70.');if(!(o.d>=0&&o.d<=111))errs.push('Fila '+line+': Días debe estar entre 0 y 111.');
  skc.forEach(function(k){var t=val(r,k[2]),v=+t;if(t===''||!Number.isInteger(v)||v<0||v>20)errs.push('Fila '+line+': '+k[1]+' debe ser un entero de 0 a 20.');o.s[k[0]]=v});
  [['a','Liga'],['b','Amistoso']].forEach(function(f){if(o[f[0]]&&POS.indexOf(o[f[0]])<0)errs.push('Fila '+line+': '+f[1]+' debe ser POR, DL, DC, LAT, MC o DEL.')});if(POS.indexOf(o.role)<0)o.role='';list.push(o)});

function toCSV(){var hd=['Nombre','Años','Días','TSI','Especialidad','Rol'].concat(SK.map(function(k){return k[1]}),EX.map(function(x){return x[1]}),['Liga','Amistoso']);function q(x){x=String(x);return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
 var l=S.players.length?lineup(S.type):{};return '﻿'+[hd.join(';')].concat(S.players.map(function(p){var v=l[p.name]||['',''];return [p.name,p.y,p.d,p.tsi,p.spec,p.role||''].concat(SK.map(function(k){return p.s[k[0]]}),EX.map(function(x){return ax(p,x[0])}),[v[0],v[1]]).map(q).join(';')})).join('\r\n')+'\r\n'}
function dl(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)}
function loadCSVText(t){var r=csvPlayers(t);if(r.errs){var e=r.errs;msg(e.slice(0,4).join(' ')+(e.length>4?' Y '+(e.length-4)+' errores más.':'')+' No se cambió la plantilla.');return}var n=importPlayers(r.list,r.hasPos);render();msg(n+' jugadores cargados. Abre Simulador para ver los tiempos.')}
function loadPlanText(t){try{var v=JSON.parse(t);if(!v||!Array.isArray(v.players))throw 0;S=Object.assign(defaults(),v);render();msg('Plan abierto con '+S.players.length+' jugadores.')}catch(er){msg('Ese archivo no es un plan válido. Usa uno creado con Descargar plan .json.')}}

/* ===== Carpeta local (File System Access; requiere abrir el .html en Chrome o Edge) ===== */
var PLAN_FILE='plan-entrenamiento.json',CSV_FILE='plantilla-jugadores.csv',FH=null,F={st:window.showDirectoryPicker?'none':'unsup',last:'',at:'',txt:'',pending:null},fTimer=null;
function idb(mode,fn){return new Promise(function(ok,no){var r;try{r=indexedDB.open('ht-plan',1)}catch(e){no(e);return}r.onupgradeneeded=function(){r.result.createObjectStore('h')};r.onerror=function(){no(r.error)};r.onsuccess=function(){var q=fn(r.result.transaction('h',mode).objectStore('h'));q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}}})}

 else if(F.st==='blocked')h='Esta vista no permite usar carpetas. Abre el archivo .html descargado en Chrome o Edge. Por ahora tus datos quedan en este navegador.';

 else if(F.st==='reconnect')h='<button id="reconDir">Reconectar carpeta '+n+'</button> <span>El navegador pide tu permiso cada vez que abres el archivo.</span>';
 else if(F.st==='conflict')h='<span>La carpeta <b>'+n+'</b> tiene datos distintos a los de este navegador.</span> <button id="useFile">Usar los de la carpeta</button> <button id="useLocal">Conservar los del navegador</button>';
 else if(F.st==='ok')h='<span>Guardando en la carpeta <b>'+n+'</b>'+(F.at?' · último guardado '+F.at:'')+'</span> <button id="pickDir">Cambiar carpeta</button>';

 if(el.innerHTML!==h)el.innerHTML=h}
function setF(st,txt){F.st=st;F.txt=txt||'';renderFolder()}
function scheduleFolderSave(){if(F.st!=='ok')return;clearTimeout(fTimer);fTimer=setTimeout(writeFolder,350)}
function writeOne(name,text){return FH.getFileHandle(name,{create:true}).then(function(fh){return fh.createWritable().then(function(w){return w.write(text).then(function(){return w.close()})})})}
function writeFolder(force){if(F.st!=='ok'||!FH)return Promise.resolve();var k=stateKey(S);if(k===F.last&&!force)return Promise.resolve();

  var fileState=Object.assign(defaults(),v);
  if(!S.players.length&&fileState.players.length){S=fileState;F.last=stateKey(S);F.st='ok';render();return}
  if(!fileState.players.length||stateKey(fileState)===stateKey(S)){F.last=stateKey(fileState);setF('ok');return writeFolder()}
  F.pending=fileState;setF('conflict')},function(e){if(e.name!=='NotFoundError')throw e;setF('ok');return writeFolder(true)}).catch(function(e){setF('error','No pude leer la carpeta '+h.name+': '+e.message)})}

/* ===== Sugerencia de amistoso: la liga queda igual; ocupa primero las posiciones de entrenamiento completo. */

 if(e.id==='csvFile'||e.id==='planFile'){var f=e.files&&e.files[0];if(!f)return;var isPlan=e.id==='planFile';f.text().then(function(t){if(isPlan)loadPlanText(t);else loadCSVText(t)},function(){msg('No pude leer ese archivo.')})}});
document.addEventListener('click',function(ev){var e=ev.target,d=e.dataset||{};
